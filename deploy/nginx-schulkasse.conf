# nginx example for Schulkasse. Reachable only from the school network (F11.1).
server {
    listen 80;
    server_name kasse.schule.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kasse.schule.local;

    ssl_certificate     /etc/ssl/certs/kasse.schule.local.crt;
    ssl_certificate_key /etc/ssl/private/kasse.schule.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Only the school network / VPN - adjust ranges.
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;

    # Must match SCHULKASSE_MAX_UPLOAD_MB
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;

    location /static/ {
        alias /opt/schulkasse/schulkasse/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:5015;  # SCHULKASSE_PORT
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
