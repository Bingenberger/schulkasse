{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Benutzer {{ b.benutzername }}{% endblock %}
{% block content %}
<h1>Benutzer {{ b.benutzername }}</h1>
<form method="post" class="formular karte">
  {{ csrf() }}
  <div class="feld"><label for="anzeigename">Anzeigename</label><input id="anzeigename" name="anzeigename" value="{{ b.anzeigename }}" required></div>
  <div class="feld"><label for="rolle">Rolle</label>
    <select id="rolle" name="rolle">{% for k, t in ROLLEN.items() %}<option value="{{ k }}" {% if b.rolle == k %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></div>
  <label class="check"><input type="checkbox" name="aktiv" value="1" {% if b.aktiv %}checked{% endif %}> aktiv (darf sich anmelden)</label>
  <div class="feld"><label for="passwort">Neues Passwort (optional)</label><input id="passwort" type="password" name="passwort" minlength="12" autocomplete="new-password"></div>
  <div class="aktionen"><button type="submit">Speichern</button><a href="{{ url_for('verwaltung.benutzer') }}">Zurück</a></div>
</form>
{% endblock %}
